<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>오정센터 이용자 관리</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ★ 캐시 방지 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=20260910c">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="admin-body">

  <div id="loading-overlay">
    <div class="spinner"></div>
    <p class="loading-text">불러오는 중...</p>
  </div>

  <!-- Header -->
  <header class="admin-header">
    <div class="admin-title">
      <h1>👥 이용자 관리</h1>
      <span class="count-badge"><span id="member-count">0</span>명</span>
    </div>
    <div class="admin-btns">
      <button class="admin-btn btn-refresh" onclick="loadMembers()"><i class="fas fa-sync-alt"></i> 새로고침</button>
      <a class="admin-btn btn-stats" href="admin.html"><i class="fas fa-chart-pie"></i> 현황판</a>
      <a class="admin-btn btn-kiosk" href="index.html"><i class="fas fa-home"></i> 키오스크</a>
    </div>
  </header>

  <!-- 검색 바 -->
  <section class="member-search-bar">
    <div class="search-input-wrap">
      <i class="fas fa-search"></i>
      <input type="text" id="search-input" class="member-search-input" placeholder="이름 또는 전화번호로 검색..." oninput="handleSearch()">
      <button class="search-clear-btn" id="search-clear" onclick="clearSearch()" style="display:none;">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="member-filter-group">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">전체</button>
      <button class="filter-btn" data-filter="초등" onclick="setFilter('초등')">초등</button>
      <button class="filter-btn" data-filter="중등" onclick="setFilter('중등')">중등</button>
      <button class="filter-btn" data-filter="고등" onclick="setFilter('고등')">고등</button>
      <button class="filter-btn" data-filter="성인" onclick="setFilter('성인')">성인</button>
    </div>
  </section>

  <!-- 회원 목록 -->
  <section class="member-grid" id="member-list">
    <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>데이터를 불러오는 중...</p></div>
  </section>

  <!-- 수정 모달 -->
  <div id="edit-modal" class="modal-overlay">
    <div class="modal-content">
      <button class="modal-close" onclick="closeEditModal()">&times;</button>
      <h2 class="modal-title">✏️ 회원 정보 수정</h2>
      <input type="hidden" id="edit-id">

      <div class="form-group">
        <label class="form-label"><i class="fas fa-user"></i> 이름</label>
        <input type="text" id="edit-name" class="form-input" placeholder="이름 입력">
      </div>
      <div class="form-group">
        <label class="form-label"><i class="fas fa-phone-alt"></i> 전화번호</label>
        <input type="tel" id="edit-phone" class="form-input" placeholder="010-0000-0000">
      </div>
      <div class="form-group">
        <label class="form-label"><i class="fas fa-birthday-cake"></i> 생년월일</label>
        <input type="date" id="edit-birth" class="form-input">
      </div>
      <div class="form-group">
        <label class="form-label"><i class="fas fa-venus-mars"></i> 성별</label>
        <div class="gender-btns">
          <button type="button" id="edit-btn-male" class="gender-btn" onclick="setEditGender('남')">👦 남성</button>
          <button type="button" id="edit-btn-female" class="gender-btn" onclick="setEditGender('여')">👧 여성</button>
        </div>
      </div>

      <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="btn btn-primary btn-block" onclick="saveEdit()">
          <i class="fas fa-save"></i> 저장
        </button>
        <button class="btn btn-danger" style="min-width:120px;" onclick="deleteMember()">
          <i class="fas fa-trash"></i> 삭제
        </button>
      </div>
    </div>
  </div>

  <script src="js/api.js?v=20260910c"></script>
  <script src="js/members.js?v=20260910c"></script>
</body>
</html>
